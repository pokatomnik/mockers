[package]
name = "mockers"
version = "1.3.1"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
hyper = { version = "1.8.0", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
clap = { version = "4.5.51", features = ["derive"] }
mimetype-detector = "0.3.3"
routerify_ng = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.13.1", features = ["stream"] }
path-absolutize = "3.1.1"
raffia = "0.12.2"
lru = "0.16.3"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
anyhow = "1.0.102"
log = "0.4.29"
simplelog = "0.12.2"
clap_complete = "4.6.0"
futures-util = "0.3.32"
bytes = "1.11.1"
strum = "0.28.0"
strum_macros = "0.28.0"
termimad = "0.34.1"
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
rustls = "0.23.37"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
