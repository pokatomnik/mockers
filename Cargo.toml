[package]
name = "mockers"
version = "1.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
hyper = { version = "1.8.0", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
clap = { version = "4.5.51", features = ["derive"] }
mimetype-detector = "0.3.3"
routerify_ng = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.13.1", features = ["stream"] }
path-absolutize = "3.1.1"
raffia = "0.12.2"
lru = "0.16.3"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
dialoguer = "0.12.0"
anyhow = "1.0.102"
log = "0.4.29"
simplelog = "0.12.2"
clap_complete = "4.6.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
